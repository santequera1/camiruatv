# Sitio nginx de camiruatv.com (versión inicial, solo puerto 80).
# certbot le agrega el bloque 443 y la redirección 80 → 443; después, dentro
# del bloque 443, van `http2 on;` y la redirección de www → sin www.
server {
    listen 80;
    server_name camiruatv.com www.camiruatv.com;
    client_max_body_size 10M;

    root /home/ubuntu/apps/camiruatv/dist/client;

    # Chunks del build: hash en el nombre, caché inmutable. Un chunk inexistente
    # da 404 (no HTML) para que vite:preloadError recargue una vez.
    location ^~ /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # El libro 3D y las imágenes fijas de public/ (sin hash: caché corta).
    location ~* \.(glb|jpg|jpeg|png|webp|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri @ssr;
    }

    location / {
        try_files $uri @ssr;
    }

    location @ssr {
        proxy_pass http://127.0.0.1:3242;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
